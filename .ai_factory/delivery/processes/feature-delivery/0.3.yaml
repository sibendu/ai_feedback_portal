schemaVersion: 1
id: feature-delivery
version: "0.3"
name: Feature delivery
stages:
  - id: readiness
    name: Solution Architect readiness review
    mode: sequential
    steps:
      - id: review-readiness
        agent: solution-architect
        action: review-intake-readiness
        instructions: Review the whole intake end to end, including the iteration plan
          when present. Check requirements, technical decisions, dependencies
          and prerequisites. Identify technical blockers early and return
          blocked when human clarification is needed.
        access: read
        when: always
        config: {}
  - id: planning
    name: Plan iteration stories
    mode: sequential
    steps:
      - id: plan
        agent: scrum-master
        action: plan-stories
        instructions: Plan user stories for the current delivery iteration only (or the
          narrow intake for single-iteration delivery). Translate the approved
          iteration objective into actionable stories with explicit acceptance
          criteria, including documentation placement and data-contract
          boundaries when relevant. Record dependencies and keep every story
          within the iteration objectives. Do not reopen the intake-wide TPM
          iteration allocation for story-level refinements. Return an ordered
          workItems array of 1 to 20 unique ids, titles and descriptions.
        access: write
        when: always
        config: {}
  - id: analysis
    name: Elaborate stories and design tests
    mode: parallel
    steps:
      - id: stories
        agent: business-analyst
        action: analyze
        instructions: Elaborate every planned story in this iteration with requirements,
          acceptance criteria and edge cases. Preserve planned story ids. Own
          requirement artifacts; do not edit test-design artifacts.
        access: write
        when: always
        config: {}
      - id: test-design
        agent: test-architect
        action: design-tests
        instructions: Create traceable test cases for all planned stories in this
          iteration, including failure cases. Own test-design artifacts; do not
          edit requirement artifacts. Work from the shared story plan.
        access: write
        when: always
        config: {}
  - id: scope-review
    name: Review iteration readiness
    mode: sequential
    steps:
      - id: scope
        agent: technical-architect
        action: review-iteration-scope
        instructions: Review all current iteration stories, elaborated requirements and
          test cases for consistency, feasibility and technical readiness. Bound
          this review to current iteration objectives. Return planning-layer
          defects only when the existing planner, analyst or test designer can
          correct them from available evidence; the engine will send up to two
          such repair cycles back automatically. Return blocked for missing
          business input, wider architecture/technical decisions, safety
          concerns, or unavailable prerequisites.
        access: read
        when: always
        config: {}
    remediationLoop:
      repairStage: analysis
      maxRepairs: 2
  - id: delivery
    name: Develop and test complete iteration
    mode: iteration
    steps:
      - id: build
        agent: full-stack-developer
        action: implement
        instructions: Implement every planned story in the current delivery iteration.
          Follow the elaborated requirements, acceptance criteria and test
          design. On remediation attempts fix the reported iteration test
          defects and update regression tests.
        access: write
        when: always
        config: {}
      - id: test
        agent: tester
        action: test
        instructions: After the developer completes all planned stories, execute
          integrated, regression and acceptance tests for the complete
          iteration. Report defects with evidence; never claim unexecuted tests
          passed. Success requires every iteration objective to pass.
        access: write
        when: always
        config: {}
    exitWhen: testing.accepted
    requiresPlan: plan-stories
  - id: iteration-review
    name: Technical Architect final iteration delivery review
    mode: sequential
    steps:
      - id: review-delivery
        agent: technical-architect
        action: review-iteration-delivery
        instructions: "After the complete iteration passes testing, review the delivery
          end to end, including all stories, cross-story architecture,
          integration and test evidence. Do not run a production build here:
          final production readiness is verified once after all delivery
          iterations. Return defects for corrections the developer and tester
          can make within the approved scope; the engine sends these back for up
          to two automatic repair and retest cycles. Return blocked with focused
          decisions for changes to business intent, architecture, safety, scope
          or acceptance criteria. Approve only when the iteration objectives are
          satisfied."
        access: read
        when: always
        config: {}
    deliveryReviewLoop:
      repairStage: delivery
      maxRepairs: 2
  - id: production-verification
    name: Verify final production readiness
    mode: sequential
    steps:
      - id: verify-production
        agent: technical-architect
        action: release-readiness
        instructions: After every planned delivery iteration has passed its own review,
          perform the project-native final production build and applicable
          non-browser release checks once for this intake. This is not an
          iteration check. Build output and verification reports may be created,
          but do not modify application source, dependencies, deployment
          configuration, or environment files. Report the exact checks and
          evidence. A real non-zero exit, timeout, or unresolved verification
          failure is a blocker.
        access: write
        when: always
        config: {}
  - id: solution-review
    name: Review overall intake solution
    mode: sequential
    steps:
      - id: review-solution
        agent: solution-architect
        action: review-intake-solution
        instructions: Review the completed intake end to end across all delivery
          iterations. Check requirements coverage, architecture, integration and
          test evidence. Report unresolved issues as defects or blocked.
        access: read
        when: always
        config: {}
  - id: closure
    name: Technical Project Manager intake closure
    mode: sequential
    steps:
      - id: close
        agent: technical-project-manager
        action: close-intake
        instructions: Close the intake only after the Solution Architect review passes.
          Record delivered scope, story and iteration outcomes, test and review
          evidence, decisions and any explicitly accepted limitations. Do not
          deploy or publish.
        access: write
        when: always
        config: {}
